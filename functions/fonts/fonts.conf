<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Fontconfig for librsvg (sharp) inside the Cloud Function: only the fonts in this folder, cache in /tmp.
     printsheet.js writes a copy of this file with the two placeholders filled in and points FONTCONFIG_FILE at it
     before sharp is loaded. The fonts are static instances of the site's fonts (see fontmetrics.js). -->
<fontconfig>
  <dir>@FONTS_DIR@</dir>
  <cachedir>@CACHE_DIR@</cachedir>
  <!-- the web fallbacks named in the SVGs are not installed here: map them onto our own fonts -->
  <alias><family>Georgia</family><prefer><family>Playfair Display</family><family>DM Serif Display</family></prefer></alias>
  <alias><family>Times New Roman</family><prefer><family>Cinzel</family></prefer></alias>
  <alias><family>Impact</family><prefer><family>Bebas Neue</family></prefer></alias>
  <alias><family>serif</family><prefer><family>DM Serif Display</family><family>Playfair Display</family></prefer></alias>
  <alias><family>sans-serif</family><prefer><family>Jost</family><family>Josefin Sans</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>DM Mono</family></prefer></alias>
  <alias><family>ui-monospace</family><prefer><family>DM Mono</family></prefer></alias>
</fontconfig>
