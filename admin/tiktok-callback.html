<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Connecting TikTok Shop · Hive Admin</title>
<style>body{margin:0;font:16px/1.5 system-ui,sans-serif;background:#FFF6E5;color:#2B2118;display:grid;place-items:center;min-height:100vh;padding:16px}</style>
</head>
<body>
<p>Connecting TikTok Shop…</p>
<script>
/* TikTok sends the owner back here after authorizing (the Redirect URL of the Hive Admin app in the Partner Center);
   the Hive Admin's TikTok Shop page finishes it (functions/tiktok.js, action "finish"). */
(function () {
  var q = new URLSearchParams(location.search), out = new URLSearchParams();
  ['code', 'state', 'error'].forEach(function (k) { var v = q.get(k); if (v && v !== 'null') out.set(k, v); });
  location.replace('./index.html#tiktok?' + out.toString());
})();
</script>
</body>
</html>
