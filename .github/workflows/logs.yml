# Reads the store backend's recent warnings/errors from Google Cloud Logging and shows them as annotations
# on the run page (handy from a phone, and readable through the GitHub API). Run it from Actions → "Store logs".
name: Store logs

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "How many minutes back to look"
        default: "60"

jobs:
  logs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT: ${{ vars.FIREBASE_PROJECT || 'little-hive-house' }}
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER || 'projects/752604920358/locations/global/workloadIdentityPools/github/providers/github' }}
          service_account: ${{ vars.DEPLOY_SA || 'github-deploy@little-hive-house.iam.gserviceaccount.com' }}
          create_credentials_file: true
          export_environment_variables: true
      - name: Read recent errors
        env:
          MINUTES: ${{ inputs.minutes }}
        run: |
          gcloud logging read 'severity>=WARNING AND (resource.type="cloud_run_revision" OR resource.type="cloud_function")' \
            --project "$PROJECT" --freshness="${MINUTES:-60}m" --limit 40 --order desc --format=json > raw.json 2>err.txt || cat err.txt
          python3 - <<'PY' > logs.txt
          import json
          try: rows = json.load(open("raw.json"))
          except Exception: rows = []
          for e in rows:
              pay = e.get("textPayload") or e.get("jsonPayload") or (e.get("protoPayload") or {}).get("status") or e.get("httpRequest") or ""
              if not isinstance(pay, str): pay = json.dumps(pay)[:1500]
              svc = (e.get("resource", {}).get("labels", {}) or {}).get("service_name", "")
              print(f"{e.get('timestamp','')[:19]} {svc} {e.get('severity','')} {pay}".replace("\n", " | "))
          PY
          cat logs.txt
          n=0
          while IFS= read -r line && [ $n -lt 40 ]; do
            line="$(printf '%s' "$line" | cut -c1-1600)"; line="${line//'%'/'%25'}"
            echo "::warning title=log::$line"; n=$((n + 1))
          done < logs.txt
          [ -s logs.txt ] || echo "::notice title=log::No warnings or errors in the last ${MINUTES:-60} minutes"
