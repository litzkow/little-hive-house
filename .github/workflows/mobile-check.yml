name: Mobile check (Safari engine)
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install Playwright WebKit
        run: |
          mkdir -p qa && cd qa && npm init -y >/dev/null && npm i playwright@1.48.2 >/dev/null
          npx playwright install --with-deps webkit
      - name: Check every page on iPhone sizes
        run: |
          cd qa && mkdir -p shots && cp ../tools/qa/mobile_check.mjs . && node mobile_check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: shots, path: qa/shots }
