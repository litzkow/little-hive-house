# One-off store maintenance, run by hand from Actions. Uses the same keyless Google sign-in as the deploy.
name: Store maintenance

on:
  workflow_dispatch:
    inputs:
      task:
        description: "clear-test-orders (deletes Stripe TEST-mode orders and resets numbering), set-print-image (printed picture size, value below) check-shippo (tests the Shippo key) or set-ship-from (label return address, JSON in value)"
        default: "clear-test-orders"
      dry_run:
        description: "1 = only list what would change"
        default: "0"
      value:
        description: "set-print-image: the printed picture size in inches"
        default: "2.02"
      cut:
        description: "set-print-image: the punch's paper piece in inches (empty = leave as is)"
        default: ""

jobs:
  maint:
    if: inputs.task != 'import-content' && inputs.task != 'stock-photos'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT: ${{ vars.FIREBASE_PROJECT || 'little-hive-house' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER || 'projects/752604920358/locations/global/workloadIdentityPools/github/providers/github' }}
          service_account: ${{ vars.DEPLOY_SA || 'github-deploy@little-hive-house.iam.gserviceaccount.com' }}
          create_credentials_file: true
          export_environment_variables: true
      - name: "Anúncios: o robô roda agora"
        if: inputs.task == 'check-ads'
        run: |
          gcloud scheduler jobs run firebase-schedule-adsDaily-us-east1 --location us-east1 --project "$PROJECT"
          sleep 90
      - name: "Analytics: o servidor lê o Google Analytics agora"
        if: inputs.task == 'check-analytics'
        run: |
          gcloud scheduler jobs run firebase-schedule-analyticsWarm-us-east1 --location us-east1 --project "$PROJECT"
          sleep 75
      - name: Install
        if: always()
        working-directory: tools/maint
        run: |
          echo '{"private":true}' > package.json
          npm install --no-audit --no-fund @google-cloud/firestore@7 @google-cloud/storage@7
      - name: "Shippo: a chave existe"
        if: inputs.task == 'check-shippo'
        env: { SHIPPO_API_KEY: "${{ secrets.SHIPPO_API_KEY }}", CHECK: exists }
        run: node tools/maint/check-shippo.js
      - name: "Shippo: começa com shippo_"
        if: always() && inputs.task == 'check-shippo'
        env: { SHIPPO_API_KEY: "${{ secrets.SHIPPO_API_KEY }}", CHECK: shippo }
        run: node tools/maint/check-shippo.js
      - name: "Shippo: é uma chave de teste"
        if: always() && inputs.task == 'check-shippo'
        env: { SHIPPO_API_KEY: "${{ secrets.SHIPPO_API_KEY }}", CHECK: test }
        run: node tools/maint/check-shippo.js
      - name: "Shippo: tem aspas"
        if: always() && inputs.task == 'check-shippo'
        env: { SHIPPO_API_KEY: "${{ secrets.SHIPPO_API_KEY }}", CHECK: quoted }
        run: node tools/maint/check-shippo.js
      - name: "Shippo: tem 30+ letras"
        if: always() && inputs.task == 'check-shippo'
        env: { SHIPPO_API_KEY: "${{ secrets.SHIPPO_API_KEY }}", CHECK: long }
        run: node tools/maint/check-shippo.js
      - name: "Shippo: a chave é live"
        if: always() && inputs.task == 'check-shippo'
        env: { SHIPPO_API_KEY: "${{ secrets.SHIPPO_API_KEY }}", CHECK: live }
        run: node tools/maint/check-shippo.js
      - name: "Shippo: o Shippo aceita a chave"
        if: always() && inputs.task == 'check-shippo'
        env: { SHIPPO_API_KEY: "${{ secrets.SHIPPO_API_KEY }}", CHECK: accepted }
        run: node tools/maint/check-shippo.js
      - name: "Shippo: a conta USPS está ativa"
        if: always() && inputs.task == 'check-shippo'
        env: { SHIPPO_API_KEY: "${{ secrets.SHIPPO_API_KEY }}", CHECK: usps }
        run: node tools/maint/check-shippo.js
      - name: "Shippo: parece um token (ey…)"
        if: always() && inputs.task == 'check-shippo'
        env: { SHIPPO_API_KEY: "${{ secrets.SHIPPO_API_KEY }}", CHECK: jwt }
        run: node tools/maint/check-shippo.js
      - name: "Shippo: tem pontos"
        if: always() && inputs.task == 'check-shippo'
        env: { SHIPPO_API_KEY: "${{ secrets.SHIPPO_API_KEY }}", CHECK: dots }
        run: node tools/maint/check-shippo.js
      - name: "Shippo: tem espaço no meio"
        if: always() && inputs.task == 'check-shippo'
        env: { SHIPPO_API_KEY: "${{ secrets.SHIPPO_API_KEY }}", CHECK: space }
        run: node tools/maint/check-shippo.js
      - name: "Shippo: tem 100+ letras"
        if: always() && inputs.task == 'check-shippo'
        env: { SHIPPO_API_KEY: "${{ secrets.SHIPPO_API_KEY }}", CHECK: long100 }
        run: node tools/maint/check-shippo.js
      - name: "Shippo: o Shippo aceita como Bearer"
        if: always() && inputs.task == 'check-shippo'
        env: { SHIPPO_API_KEY: "${{ secrets.SHIPPO_API_KEY }}", CHECK: bearer }
        run: node tools/maint/check-shippo.js
      - name: "Shippo: é um link"
        if: always() && inputs.task == 'check-shippo'
        env: { SHIPPO_API_KEY: "${{ secrets.SHIPPO_API_KEY }}", CHECK: url }
        run: node tools/maint/check-shippo.js
      - name: "Shippo: tem @ (e-mail)"
        if: always() && inputs.task == 'check-shippo'
        env: { SHIPPO_API_KEY: "${{ secrets.SHIPPO_API_KEY }}", CHECK: email }
        run: node tools/maint/check-shippo.js
      - name: "Vision: ligar a API de rostos e conferir o enquadramento automático de um pedido (só números, nada salvo)"
        if: always() && inputs.task == 'autocrop-check'
        env: { ORDER: "${{ inputs.value }}" }
        run: |
          gcloud services enable vision.googleapis.com --project "$PROJECT" || echo "::warning::Could not enable the Cloud Vision API"
          (cd tools/maint && npm install --no-audit --no-fund sharp@0.35 >/dev/null)
          TOKEN=$(gcloud auth print-access-token) node tools/maint/autocrop-check.js
      - name: "Fotos: reenquadrar para não cortar rostos (value = LHH-1003:1,3,8; só números no registro)"
        if: always() && inputs.task == 'fix-crops'
        env: { ORDER_PHOTOS: "${{ inputs.value }}", DRY_RUN: "${{ inputs.dry_run }}" }
        run: |
          pip install --quiet opencv-python-headless==4.10.0.84 pillow pillow-heif google-cloud-storage google-cloud-firestore
          curl -sSfL -o /tmp/yunet.onnx https://media.githubusercontent.com/media/opencv/opencv_zoo/main/models/face_detection_yunet/face_detection_yunet_2023mar.onnx || echo "YuNet model not downloaded, using Haar"
          python3 tools/maint/fix-crops.py
      - name: "Problemas dos clientes: avisos, envios de fotos e pedidos recentes (sem dados pessoais)"
        if: always() && inputs.task == 'client-errors'
        env: { HOURS: "${{ inputs.value }}" }
        run: node tools/maint/client-errors.js
      - name: "Pedido: pedido encontrado"
        if: always() && inputs.task == 'check-order'
        env: { ORDER: "${{ inputs.value }}", CHECK: found, SHIPPO_API_KEY: "${{ secrets.SHIPPO_API_KEY }}" }
        run: node tools/maint/check-order.js
      - name: "Pedido: tem etiqueta comprada"
        if: always() && inputs.task == 'check-order'
        env: { ORDER: "${{ inputs.value }}", CHECK: label, SHIPPO_API_KEY: "${{ secrets.SHIPPO_API_KEY }}" }
        run: node tools/maint/check-order.js
      - name: "Pedido: está como enviado"
        if: always() && inputs.task == 'check-order'
        env: { ORDER: "${{ inputs.value }}", CHECK: shipped, SHIPPO_API_KEY: "${{ secrets.SHIPPO_API_KEY }}" }
        run: node tools/maint/check-order.js
      - name: "Pedido: cartão cobrado"
        if: always() && inputs.task == 'check-order'
        env: { ORDER: "${{ inputs.value }}", CHECK: charged, SHIPPO_API_KEY: "${{ secrets.SHIPPO_API_KEY }}" }
        run: node tools/maint/check-order.js
      - name: "Pedido: Shippo tem etiqueta comprada"
        if: always() && inputs.task == 'check-order'
        env: { ORDER: "${{ inputs.value }}", CHECK: shippo, SHIPPO_API_KEY: "${{ secrets.SHIPPO_API_KEY }}" }
        run: node tools/maint/check-order.js
      - name: "Analytics: a leitura aconteceu agora"
        if: always() && inputs.task == 'check-analytics'
        env: { CHECK: fresh }
        run: node tools/maint/check-analytics.js
      - name: "Analytics: deu certo"
        if: always() && inputs.task == 'check-analytics'
        env: { CHECK: ok }
        run: node tools/maint/check-analytics.js
      - name: "Analytics: erro é falta de acesso"
        if: always() && inputs.task == 'check-analytics'
        env: { CHECK: access }
        run: node tools/maint/check-analytics.js
      - name: "Analytics: erro é API desligada"
        if: always() && inputs.task == 'check-analytics'
        env: { CHECK: api }
        run: node tools/maint/check-analytics.js
      - name: "Anúncios: mudar teto e orçamentos (value = JSON)"
        if: inputs.task == 'set-ads'
        env: { VALUE: "${{ inputs.value }}" }
        run: node tools/maint/set-ads.js
      - name: "Anúncios: o robô rodou agora"
        if: always() && inputs.task == 'check-ads'
        env: { CHECK: fresh }
        run: node tools/maint/check-ads.js
      - name: "Anúncios: leu as vendas do site (Google Analytics)"
        if: always() && inputs.task == 'check-ads'
        env: { CHECK: site }
        run: node tools/maint/check-ads.js
      - name: "Anúncios: leu o Etsy"
        if: always() && inputs.task == 'check-ads'
        env: { CHECK: etsy }
        run: node tools/maint/check-ads.js
      - name: "Anúncios: leu o Meta (ou ainda não conectado)"
        if: always() && inputs.task == 'check-ads'
        env: { CHECK: meta }
        run: node tools/maint/check-ads.js
      - name: "Etsy: como as fotos estão arrumadas em cada anúncio"
        if: inputs.task == 'etsy-images'
        env: { ETSY_KEYSTRING: "${{ secrets.ETSY_KEYSTRING }}", ETSY_SHARED_SECRET: "${{ secrets.ETSY_SHARED_SECRET }}", VALUE: "${{ inputs.value }}" }
        run: node tools/maint/etsy-images.js
      - name: "Etsy: testar como arrumar as fotos de um anúncio"
        if: inputs.task == 'etsy-try'
        env: { ETSY_KEYSTRING: "${{ secrets.ETSY_KEYSTRING }}", ETSY_SHARED_SECRET: "${{ secrets.ETSY_SHARED_SECRET }}", VALUE: "${{ inputs.value }}" }
        run: node tools/maint/etsy-try.js
      - name: "Etsy: título e aviso da loja"
        if: inputs.task == 'etsy-shop'
        env: { ETSY_KEYSTRING: "${{ secrets.ETSY_KEYSTRING }}", ETSY_SHARED_SECRET: "${{ secrets.ETSY_SHARED_SECRET }}" }
        run: node tools/maint/etsy-shop.js
      - name: "Etsy: caixas de personalização dos ímãs com foto"
        if: inputs.task == 'etsy-perso'
        env: { ETSY_KEYSTRING: "${{ secrets.ETSY_KEYSTRING }}", ETSY_SHARED_SECRET: "${{ secrets.ETSY_SHARED_SECRET }}", VALUE: "${{ inputs.value }}" }
        run: node tools/maint/etsy-perso.js
      - name: "Etsy: publicar / mandar fotos novas (o mesmo que o botão do Hive Admin)"
        if: inputs.task == 'etsy-publish'
        env: { ETSY_KEYSTRING: "${{ secrets.ETSY_KEYSTRING }}", ETSY_SHARED_SECRET: "${{ secrets.ETSY_SHARED_SECRET }}", VALUE: "${{ inputs.value }}", GCLOUD_PROJECT: "${{ vars.FIREBASE_PROJECT || 'little-hive-house' }}" }
        run: |
          (cd functions && npm install --no-audit --no-fund --omit=dev >/dev/null)
          node tools/maint/etsy-publish.js
      - name: "Anúncios: aplicar agora o público (só EUA + interesses)"
        if: inputs.task == 'ads-audience'
        run: |
          (cd functions && npm install --no-audit --no-fund --omit=dev >/dev/null)
          node tools/maint/ads-audience.js
      - name: "Pedido: quais e-mails o cliente recebeu"
        if: inputs.task == 'order-emails'
        env: { VALUE: "${{ inputs.value }}", RESEND_API_KEY: "${{ secrets.RESEND_API_KEY }}" }
        run: node tools/maint/order-emails.js
      - name: "Loja do Meta: catálogo e categorias"
        if: inputs.task == 'probe-shop'
        env: { VALUE: "${{ inputs.value }}" }
        run: node tools/maint/probe-shop.js
      - name: "Loja do Meta: criar ou atualizar as categorias"
        if: inputs.task == 'meta-shop-collections'
        env: { VALUE: "${{ inputs.value }}" }
        run: node tools/maint/meta-shop-collections.js
      - name: "Anúncios: quais públicos existem no Meta"
        if: inputs.task == 'meta-audience-lookup'
        run: node tools/maint/meta-audience-lookup.js
      - name: "Meta: quais permissões a conexão tem"
        if: inputs.task == 'check-meta-perms'
        run: |
          (cd functions && npm install --no-audit --no-fund --omit=dev >/dev/null)
          node tools/maint/check-meta-perms.js
      - name: "Meta: onde estão os agendados"
        if: inputs.task == 'probe-meta'
        run: |
          (cd functions && npm install --no-audit --no-fund --omit=dev >/dev/null)
          node tools/maint/probe-meta.js
      - name: "Meta: o que as opções de agendamento podem usar (local, colaboradores)"
        if: inputs.task == 'probe-meta-options'
        run: |
          (cd functions && npm install --no-audit --no-fund --omit=dev >/dev/null)
          node tools/maint/probe-meta-options.js
      - name: "Anúncios: pausar tudo e desligar a escolha automática"
        if: inputs.task == 'ads-pause-all'
        run: |
          (cd functions && npm install --no-audit --no-fund --omit=dev >/dev/null)
          node tools/maint/ads-pause-all.js
      - name: "Meta: Pixel (cria se não houver), permissões e métricas dos Reels"
        if: inputs.task == 'meta-pixel'
        env: { CREATE: "${{ inputs.value }}" }
        run: |
          (cd functions && npm install --no-audit --no-fund --omit=dev >/dev/null)
          node tools/maint/meta-pixel.js
      - name: "Conteúdo: o que a aba tem agora, depois de ler o Meta"
        if: inputs.task == 'check-content'
        run: |
          (cd functions && npm install --no-audit --no-fund --omit=dev >/dev/null)
          node tools/maint/check-content.js
      - name: Run
        if: inputs.task != 'probe-meta' && inputs.task != 'probe-meta-options' && inputs.task != 'ads-pause-all' && inputs.task != 'ads-audience' && inputs.task != 'order-emails' && inputs.task != 'probe-shop' && inputs.task != 'meta-shop-collections' && inputs.task != 'meta-audience-lookup' && inputs.task != 'meta-pixel' && inputs.task != 'check-meta-perms' && inputs.task != 'check-content' && inputs.task != 'check-shippo' && inputs.task != 'check-order' && inputs.task != 'check-analytics' && inputs.task != 'etsy-images' && inputs.task != 'etsy-try' && inputs.task != 'etsy-publish' && inputs.task != 'etsy-shop' && inputs.task != 'etsy-perso'
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          VALUE: ${{ inputs.value }}
          CUT: ${{ inputs.cut }}
        run: |
          case "${{ inputs.task }}" in
            clear-test-orders) node tools/maint/clear-test-orders.js ;;
            set-print-image) node tools/maint/set-print-image.js ;;
            set-ship-from) node tools/maint/set-ship-from.js ;;
            seed-supplies) node tools/maint/seed-supplies.js ;;
            add-purchase) node tools/maint/add-purchase.js ;;
            supply-bought) node tools/maint/supply-bought.js ;;
            content-key) node tools/maint/content-key.js ;;
            content-fix-sent) node tools/maint/content-fix-sent.js ;;
            content-set-when) node tools/maint/content-set-when.js ;;
            ads-state) node tools/maint/ads-state.js ;;
            ads-next-reel) node tools/maint/ads-next-reel.js ;;
            ads-check-ad) node tools/maint/ads-check-ad.js ;;
            check-ads) echo "(feito nos passos acima)" ;;
            client-errors|fix-crops|autocrop-check|check-order|check-shippo|check-analytics) echo "(done in its own steps above)" ;;
            *) echo "::error::Unknown task ${{ inputs.task }}"; exit 1 ;;
          esac

  # Conteúdo: põe vídeos editados na aba Conteúdo (Compartilhados). VALUE = o galho temporário com os arquivos trancados
  # (pasta import/, trancados com a chave de content-key). No fim apaga o galho.
  import-content:
    if: inputs.task == 'import-content'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      PROJECT: ${{ vars.FIREBASE_PROJECT || 'little-hive-house' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: "Conteúdo: pegar os arquivos trancados do galho"
        run: |
          git fetch --depth 1 origin "${{ inputs.value }}"
          mkdir -p /tmp/import && git --work-tree=/tmp/import checkout FETCH_HEAD -- import && mv /tmp/import/import/* /tmp/import/
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER || 'projects/752604920358/locations/global/workloadIdentityPools/github/providers/github' }}
          service_account: ${{ vars.DEPLOY_SA || 'github-deploy@little-hive-house.iam.gserviceaccount.com' }}
          create_credentials_file: true
          export_environment_variables: true
      - name: "Conteúdo: destrancar e subir para o app"
        working-directory: tools/maint
        env: { DIR: /tmp/import }
        run: |
          echo '{"private":true}' > package.json
          npm install --no-audit --no-fund @google-cloud/firestore@7 @google-cloud/storage@7 >/dev/null
          node import-content.js
      - name: "Conteúdo: apagar o galho temporário"
        if: always()
        run: git push origin --delete "${{ inputs.value }}" || true

  # Fotos de banco gratuito (Unsplash / CC0) para os exemplos do site. VALUE = JSON {"pasta": "busca"}. Salva no galho stock-photos.
  stock-photos:
    if: inputs.task == 'stock-photos'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: "Fotos: buscar e baixar"
        env: { QUERIES: "${{ inputs.value }}", PER: "${{ inputs.cut || '12' }}", OUT: /tmp/stock }
        run: node tools/maint/stock-photos.js
      - name: "Fotos: guardar no galho stock-photos"
        run: |
          cd /tmp/stock && git init -q && git checkout -q -b stock-photos
          git add -A && git -c user.name=robo -c user.email=robo@users.noreply.github.com commit -qm "Fotos de banco gratuito"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" stock-photos
