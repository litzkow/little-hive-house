# One-off store maintenance, run by hand from Actions. Uses the same keyless Google sign-in as the deploy.
name: Store maintenance

on:
  workflow_dispatch:
    inputs:
      task:
        description: "clear-test-orders (deletes Stripe TEST-mode orders and resets numbering), set-print-image (printed picture size, value below) check-shippo (tests the Shippo key) or set-ship-from (label return address, JSON in value)"
        default: "clear-test-orders"
      dry_run:
        description: "1 = only list what would change"
        default: "0"
      value:
        description: "set-print-image: the printed picture size in inches"
        default: "2.02"
      cut:
        description: "set-print-image: the punch's paper piece in inches (empty = leave as is)"
        default: ""

jobs:
  maint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT: ${{ vars.FIREBASE_PROJECT || 'little-hive-house' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER || 'projects/752604920358/locations/global/workloadIdentityPools/github/providers/github' }}
          service_account: ${{ vars.DEPLOY_SA || 'github-deploy@little-hive-house.iam.gserviceaccount.com' }}
          create_credentials_file: true
          export_environment_variables: true
      - name: Install
        working-directory: tools/maint
        run: |
          echo '{"private":true}' > package.json
          npm install --no-audit --no-fund @google-cloud/firestore@7 @google-cloud/storage@7
      - name: "Shippo: a chave existe"
        if: inputs.task == 'check-shippo'
        env: { SHIPPO_API_KEY: "${{ secrets.SHIPPO_API_KEY }}", CHECK: exists }
        run: node tools/maint/check-shippo.js
      - name: "Shippo: começa com shippo_"
        if: always() && inputs.task == 'check-shippo'
        env: { SHIPPO_API_KEY: "${{ secrets.SHIPPO_API_KEY }}", CHECK: shippo }
        run: node tools/maint/check-shippo.js
      - name: "Shippo: é uma chave de teste"
        if: always() && inputs.task == 'check-shippo'
        env: { SHIPPO_API_KEY: "${{ secrets.SHIPPO_API_KEY }}", CHECK: test }
        run: node tools/maint/check-shippo.js
      - name: "Shippo: tem aspas"
        if: always() && inputs.task == 'check-shippo'
        env: { SHIPPO_API_KEY: "${{ secrets.SHIPPO_API_KEY }}", CHECK: quoted }
        run: node tools/maint/check-shippo.js
      - name: "Shippo: tem 30+ letras"
        if: always() && inputs.task == 'check-shippo'
        env: { SHIPPO_API_KEY: "${{ secrets.SHIPPO_API_KEY }}", CHECK: long }
        run: node tools/maint/check-shippo.js
      - name: "Shippo: a chave é live"
        if: always() && inputs.task == 'check-shippo'
        env: { SHIPPO_API_KEY: "${{ secrets.SHIPPO_API_KEY }}", CHECK: live }
        run: node tools/maint/check-shippo.js
      - name: "Shippo: o Shippo aceita a chave"
        if: always() && inputs.task == 'check-shippo'
        env: { SHIPPO_API_KEY: "${{ secrets.SHIPPO_API_KEY }}", CHECK: accepted }
        run: node tools/maint/check-shippo.js
      - name: "Shippo: a conta USPS está ativa"
        if: always() && inputs.task == 'check-shippo'
        env: { SHIPPO_API_KEY: "${{ secrets.SHIPPO_API_KEY }}", CHECK: usps }
        run: node tools/maint/check-shippo.js
      - name: "Shippo: parece um token (ey…)"
        if: always() && inputs.task == 'check-shippo'
        env: { SHIPPO_API_KEY: "${{ secrets.SHIPPO_API_KEY }}", CHECK: jwt }
        run: node tools/maint/check-shippo.js
      - name: "Shippo: tem pontos"
        if: always() && inputs.task == 'check-shippo'
        env: { SHIPPO_API_KEY: "${{ secrets.SHIPPO_API_KEY }}", CHECK: dots }
        run: node tools/maint/check-shippo.js
      - name: "Shippo: tem espaço no meio"
        if: always() && inputs.task == 'check-shippo'
        env: { SHIPPO_API_KEY: "${{ secrets.SHIPPO_API_KEY }}", CHECK: space }
        run: node tools/maint/check-shippo.js
      - name: "Shippo: tem 100+ letras"
        if: always() && inputs.task == 'check-shippo'
        env: { SHIPPO_API_KEY: "${{ secrets.SHIPPO_API_KEY }}", CHECK: long100 }
        run: node tools/maint/check-shippo.js
      - name: "Shippo: o Shippo aceita como Bearer"
        if: always() && inputs.task == 'check-shippo'
        env: { SHIPPO_API_KEY: "${{ secrets.SHIPPO_API_KEY }}", CHECK: bearer }
        run: node tools/maint/check-shippo.js
      - name: Run
        if: inputs.task != 'check-shippo'
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          VALUE: ${{ inputs.value }}
          CUT: ${{ inputs.cut }}
        run: |
          case "${{ inputs.task }}" in
            clear-test-orders) node tools/maint/clear-test-orders.js ;;
            set-print-image) node tools/maint/set-print-image.js ;;
            set-ship-from) node tools/maint/set-ship-from.js ;;
            *) echo "::error::Unknown task ${{ inputs.task }}"; exit 1 ;;
          esac
